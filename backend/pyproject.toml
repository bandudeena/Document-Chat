[project]
name = "chat-with-your-docs"
version = "0.1.0"
description = "RAG backend: answer questions about uploaded documents using AWS Bedrock"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.128",
    "uvicorn[standard]>=0.34",
    "pydantic-settings>=2.7",
    "langchain>=0.3",
    "langchain-aws>=0.2",
    "langchain-text-splitters>=0.3",
    "faiss-cpu>=1.9",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "pillow>=10.4",
    "python-multipart>=0.0.18",
    "langchain-community>=0.4.2",
    "rank-bm25>=0.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "ruff>=0.8",
    "reportlab>=4.2",  # only used to generate test-fixture PDFs
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
